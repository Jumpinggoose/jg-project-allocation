services:
  - type: web
    name: jg-project-allocation
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    buildCommand: python3 -m py_compile server.py
    startCommand: python3 server.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: JG_DATA_DIR
        value: /var/data
      - key: JG_USERS_JSON
        sync: false
      - key: JG_SESSION_HOURS
        value: 12
      - key: JG_SECURE_COOKIES
        value: "true"
    disk:
      name: jg-project-data
      mountPath: /var/data
      sizeGB: 1
