<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F0F">
  <meta name="description" content="Secure sign-in for the JUMPINGGOOSE project allocation application.">
  <title>Sign in · JG Project Allocation</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="jg-dark-pink.css">
</head>
<body>
  <main class="login-page">
    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">JG</div>
        <div>
          <div class="brand-name">JUMPINGGOOSE</div>
          <div class="brand-subtitle">Project Allocation</div>
        </div>
      </div>

      <div class="login-copy">
        <div class="eyebrow">CORE TEAM ACCESS</div>
        <h1 id="loginTitle">Sign in to the live workspace.</h1>
        <p>Continue securely with your approved Google account.</p>
      </div>

      <div class="login-actions">
        <button class="google-signin-button" id="googleSignInButton" type="button">
          <span class="google-icon" aria-hidden="true">G</span>
          <span>Continue with Google</span>
          <span class="google-arrow" aria-hidden="true">→</span>
        </button>
        <p class="form-message" id="formMessage" role="alert" hidden></p>
      </div>

      <p class="login-footnote">Access is restricted to approved, active JG accounts. Personal Gmail accounts require administrator approval.</p>
    </section>

    <aside class="login-art" aria-hidden="true">
      <div class="art-number">01</div>
      <div class="art-lines"><span></span><span></span><span></span></div>
      <div class="art-copy">PONDS<br>PROJECTS<br>PEOPLE</div>
      <div class="accent-block"></div>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js" defer></script>
</body>
</html>
