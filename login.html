<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F0F">
  <meta name="description" content="Secure sign-in for the JUMPINGGOOSE project allocation application.">
  <title>Sign in · JG Project Allocation</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-panel" aria-labelledby="loginTitle">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">JG</div>
        <div>
          <div class="brand-name">JUMPINGGOOSE</div>
          <div class="brand-subtitle">Project Allocation</div>
        </div>
      </div>

      <div class="login-copy">
        <div class="eyebrow">CORE TEAM ACCESS</div>
        <h1 id="loginTitle">Sign in to the live workspace.</h1>
        <p>Use the account provided by the JUMPINGGOOSE administrator.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <label class="field">
          <span>Email address</span>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-message" id="formMessage" role="alert" hidden></p>
        <button class="sign-in-button" id="signInButton" type="submit">Sign in</button>
      </form>

      <p class="login-footnote">Access is limited to approved core-team accounts. Contact the administrator if your login is not active.</p>
    </section>

    <aside class="login-art" aria-hidden="true">
      <div class="art-number">01</div>
      <div class="art-lines"><span></span><span></span><span></span></div>
      <div class="art-copy">PONDS<br>PROJECTS<br>PEOPLE</div>
      <div class="accent-block"></div>
    </aside>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js" defer></script>
</body>
</html>
