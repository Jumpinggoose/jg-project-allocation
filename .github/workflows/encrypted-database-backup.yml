name: Encrypted database backup

on:
  workflow_dispatch:
  schedule:
    # 05:30 IST, daily. GitHub-hosted schedules may run later.
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  database-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.JG_BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.JG_BACKUP_PASSPHRASE }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" || -z "$BACKUP_PASSPHRASE" ]]; then
            echo "::error::Backup secrets are not configured. See docs/BACKUP_RECOVERY.md."
            exit 1
          fi
          if [[ "${#BACKUP_PASSPHRASE}" -lt 24 ]]; then
            echo "::error::Encryption passphrase must be at least 24 characters."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Dump database roles, schema and data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/jg-db-dump"
          cd "$RUNNER_TEMP/jg-db-dump"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          test -s roles.sql && test -s schema.sql && test -s data.sql
          sha256sum roles.sql schema.sql data.sql > checksums.sha256
          tar -czf "$RUNNER_TEMP/jg-backup.tar.gz" roles.sql schema.sql data.sql checksums.sha256

      - name: Encrypt backup and verify decryption
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secure-backup"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/jg-backup.tar.gz" \
            -out "$RUNNER_TEMP/secure-backup/jg-db-${GITHUB_RUN_ID}.tar.gz.enc" \
            -pass env:BACKUP_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/secure-backup/jg-db-${GITHUB_RUN_ID}.tar.gz.enc" \
            -pass env:BACKUP_PASSPHRASE | tar -tzf - > /dev/null
          echo "Encrypted archive passed decryption and archive-list verification."

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: jg-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/secure-backup/*.enc
          retention-days: 30
          if-no-files-found: error

      - name: Remove plaintext
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/jg-db-dump" "$RUNNER_TEMP/jg-backup.tar.gz" "$RUNNER_TEMP/secure-backup"
